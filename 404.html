<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bootcamp Hub</title>
  <script>
    // GitHub Pages SPA redirect — preserve the path as a hash
    var path = window.location.pathname.replace('/bootcamp-hub', '') || '/'
    var search = window.location.search
    var hash = window.location.hash
    var redirect = window.location.origin + '/bootcamp-hub/#' + path + search + hash
    window.location.replace(redirect)
  </script>
</head>
<body></body>
</html>
