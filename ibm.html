  class GradeBook:
      def __init__(self, student_name):
          self.name = student_name
          self.grades = []

      def add_grade(self, grade):
          if not isinstance(grade, (int, float)):
              raise TypeError("Grade must be a number")
          if not 0 <= grade <= 100:
              raise ValueError("Grade must be 0-100")
          self.grades.append(grade)

      def average(self):
          if not self.grades:
              return 0
          return sum(self.grades) / len(self.grades)

      def letter(self):
          avg = self.average()
          if avg >= 90: return "A"
          elif avg >= 80: return "B"
          elif avg >= 70: return "C"
          else: return "F"

      def report(self):
          return (f"{self.name}: "
                  f"avg={self.average():.1f}, "
                  f"grade={self.letter()}")

  MSE = (1/n) × Σ(actual - predicted)²

function generateCalendar(startDate) {
  const days = [];
  let date = new Date(startDate);
  CURRICULUM.forEach((course) => {
    course.weeks.forEach((week) => {
      week.days.forEach((day) => {
        while (date.getDay() === 0 || date.getDay() === 6)
          date = new Date(date.getTime() + 86400000);
        days.push({
          ...day,
          date: new Date(date),
          courseShort: course.courseShort,
          color: course.color,
          week: week.week,
          module: week.module,
          moduleTitle: week.moduleTitle,
        });
        date = new Date(date.getTime() + 86400000);
      });
    });
  });
  return days;
}

function App() {
  const [view,        setView]      = useState("home");
  const [selDay,      setSelDay]    = useState(null);
  // ── Lazy initialisers: read from localStorage synchronously on first render
  //    This means NO flash — progress is correct from the very first paint.
  const [completed,   setCompleted] = useState(() => {
    try {
      const raw = localStorage.getItem("ibc_done");
      return raw ? JSON.parse(raw) : {};
    } catch { return {}; }
  });
  const [quizAns,     setQuizAns]   = useState(() => {
    try {
      const raw = localStorage.getItem("ibc_quiz");
      return raw ? JSON.parse(raw) : {};
    } catch { return {}; }
  });
  const [openSec,     setOpenSec]   = useState({ lecture:true });
  const [calFilter,   setCalFilter] = useState("all");
  const [sidebarOpen, setSidebar]   = useState(false);
  const [fontSize,    setFontSize]  = useState(() => {
    try {
      const raw = localStorage.getItem("ibc_fs");
      return raw ? parseInt(raw, 10) : 15;
    } catch { return 15; }
  });

  // Apply font size to <html> whenever it changes
  useEffect(() => {
    document.documentElement.style.fontSize = fontSize + "px";
  }, [fontSize]);


  const saveDone = (u) => {
    setCompleted(u);
    try { localStorage.setItem("ibc_done", JSON.stringify(u)); } catch {}
  };
  const incFont  = () => setFontSize(f => { const n = Math.min(f+1,22); try { localStorage.setItem("ibc_fs",n); } catch {} return n; });
  const decFont  = () => setFontSize(f => { const n = Math.max(f-1,11); try { localStorage.setItem("ibc_fs",n); } catch {} return n; });

// Save quiz answers whenever they change
  useEffect(() => {
    try { localStorage.setItem("ibc_quiz", JSON.stringify(quizAns)); } catch {}
  }, [quizAns]);

  const allDays = generateCalendar("2025-01-06");
  const dayKey  = (d) => `${d.courseShort}-w${d.week}-d${d.day}`;

  const total  = allDays.length;
  const done   = Object.values(completed).filter(Boolean).length;
  const pct    = Math.round(done/total*100);
  const pyDays = allDays.filter(d => d.courseShort==="Python");
  const mlDays = allDays.filter(d => d.courseShort==="ML");
  const pyDone = pyDays.filter(d => completed[dayKey(d)]).length;
  const mlDone = mlDays.filter(d => completed[dayKey(d)]).length;

  const streak = (() => {
    let s=0, today=new Date(); today.setHours(0,0,0,0);
    for (let i=allDays.length-1;i>=0;i--) {
      if (completed[dayKey(allDays[i])]) s++;
      else if (allDays[i].date<=today) break;
    }
    return s;
  })();

  const nextDay = allDays.find(d => !completed[dayKey(d)]);
  const goLearn = (d) => { setSelDay(d); setOpenSec({lecture:true}); setView("learn"); setSidebar(false); window.scrollTo(0,0); };
  const toggleSec = (id) => setOpenSec(p => ({...p, [id]:!p[id]}));

  const sharedSidebar = (
    <Sidebar view={view} setView={setView} allDays={allDays} completed={completed}
      dayKey={dayKey} open={sidebarOpen} onClose={() => setSidebar(false)} />
  );

  const MobNav = ({ activeView }) => (
    <nav className="mobile-nav">
      <button className={`mob-btn ${activeView==="home"?"active":""}`} onClick={() => setView("home")}>
        <span className="mob-icon">⊞</span><span>Dashboard</span>
      </button>
      <button className={`mob-btn ${activeView==="calendar"?"active":""}`} onClick={() => setView("calendar")}>

      {nextDay && (
        <button className="mob-btn" style={{ color:"var(--py)" }} onClick={() => goLearn(nextDay)}>
          <span className="mob-icon">▶</span><span>Resume</span>
        </button>
      )}

    </nav>
  );

  // ══════════════════════════════════════════════════════════════════
  // DASHBOARD
  // ══════════════════════════════════════════════════════════════════
  if (view==="home") return (
    <div className="shell">
      <style>{BASE_STYLES}</style>
      {/* Mobile hamburger via CSS show */}
      <style>{`#mob-menu { display:flex !important; } @media(min-width:901px){#mob-menu{display:none!important;}}`}</style>
      {sharedSidebar}

      <main className="main">
        <Topbar
          onMenuClick={() => setSidebar(s=>!s)}
          mid={<div style={{ fontSize:"0.8125rem", fontWeight:600, color:"var(--sub)", paddingLeft:4 }}>Dashboard</div>}
          right={
            <>
              <FontCtrl size={fontSize} onInc={incFont} onDec={decFont} />
              {nextDay && (
                <button className="btn-cta hide-mob"
                  style={{ background:"linear-gradient(135deg,var(--py),#e05a1a)", boxShadow:"0 4px 16px var(--py-glow)" }}
                  onClick={() => goLearn(nextDay)}>
                  ▶ Resume
                </button>
              )}
            </>
          }
        />

        <div className="content">
          {/* Heading */}
          <div className="fade-up" style={{ marginBottom:22 }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap", marginBottom:6 }}>
              <h1 style={{ fontSize:"clamp(1.25rem,4vw,1.625rem)", fontWeight:800, lineHeight:1.2 }}>
                {done===0?"Ready to start? 🚀":done===total?"Bootcamp Complete! 🎉":`${pct}% Complete`}
              </h1>
              {streak>0 && <span className="streak">🔥 {streak} day streak</span>}
            </div>
            <p style={{ color:"var(--sub)", fontSize:"0.875rem" }}>{done} of {total} sessions · Python for Data Science + IBM AI Engineering</p>
          </div>

          {/* Stats */}
          <div className="grid-stats" style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:12, marginBottom:20 }}>
            <StatCard icon="📊" label="Overall"  value={`${pct}%`}             sub={`${done} / ${total} days`}                    color="var(--py)" cls="d1" />
            <StatCard icon="🔥" label="Streak"   value={streak}                sub="consecutive days"                              color="var(--amber)" cls="d2" />
            <StatCard icon="🐍" label="Python"   value={`${pyDone}/${pyDays.length}`} sub={`${Math.round(pyDone/pyDays.length*100)}% done`} color="var(--py)" cls="d3" />
            <StatCard icon="🤖" label="ML"       value={`${mlDone}/${mlDays.length}`} sub={`${Math.round(mlDone/mlDays.length*100)}% done`} color="var(--ml)" cls="d4" />
          </div>

          {/* Overall progress bar */}
          <div className="card fade-up d2" style={{ marginBottom:28 }}>
            <div className="card-p">
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:10 }}>
                <span style={{ fontSize:"0.875rem", fontWeight:600 }}>Total Progress</span>
                <span style={{ fontSize:"0.875rem", fontWeight:800, color:"var(--py)" }}>{pct}%</span>
              </div>
              <div className="prog" style={{ height:8 }}>
                <div className="prog-fill" style={{ width:`${pct}%`, background:"linear-gradient(90deg,var(--py),var(--ml))" }} />
              </div>
              <div style={{ display:"flex", justifyContent:"space-between", marginTop:8 }}>
                <div style={{ display:"flex", alignItems:"center", gap:5 }}>
                  <div style={{ width:7,height:7,borderRadius:"50%",background:"var(--py)" }} />
                  <span style={{ fontSize:"0.6875rem", color:"var(--sub)" }}>Python {Math.round(pyDone/pyDays.length*100)}%</span>
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:5 }}>
                  <span style={{ fontSize:"0.6875rem", color:"var(--sub)" }}>ML {Math.round(mlDone/mlDays.length*100)}%</span>
                  <div style={{ width:7,height:7,borderRadius:"50%",background:"var(--ml)" }} />
                </div>
              </div>
            </div>
          </div>

          {/* Courses */}
          {CURRICULUM.map((course, ci) => {
            const color = course.courseShort==="Python" ? "var(--py)" : "var(--ml)";
            const colorHex = course.courseShort==="Python" ? "#ff7340" : "#6c63ff";
            const cDays = allDays.filter(d => d.courseShort===course.courseShort);
            const cDone = cDays.filter(d => completed[dayKey(d)]).length;

            return (
              <div key={course.course} className="fade-up" style={{ animationDelay:`${0.1+ci*0.06}s`, marginBottom:32 }}>
                {/* Course header */}
                <div className="card" style={{ marginBottom:10, borderColor:colorHex+"44" }}>
                  <div className="card-p" style={{ display:"flex", alignItems:"center", gap:14 }}>
                    <div style={{ width:38, height:38, borderRadius:12, background:colorHex+"18", border:`1px solid ${colorHex}44`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:"1.25rem", flexShrink:0 }}>
                      {course.courseShort==="Python"?"🐍":"🤖"}
                    </div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:"0.875rem", fontWeight:700, marginBottom:6, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{course.course}</div>
                      <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                        <div className="prog" style={{ height:4, flex:1 }}>
                          <div className="prog-fill" style={{ width:`${Math.round(cDone/cDays.length*100)}%`, background:color }} />
                        </div>
                        <span style={{ fontSize:"0.75rem", fontWeight:800, color, flexShrink:0 }}>{Math.round(cDone/cDays.length*100)}%</span>
                      </div>
                    </div>
                    <div style={{ fontSize:"0.75rem", color:"var(--sub)", flexShrink:0 }}>{course.weeks.length}w · {cDays.length}d</div>
                  </div>
                </div>

                {/* Weeks */}
                {course.weeks.map((week) => {
                  const wDays = cDays.filter(d => d.week===week.week);
                  const wDone = wDays.filter(d => completed[dayKey(d)]).length;
                  const wPct  = Math.round(wDone/wDays.length*100);
                  const allDoneW = wDone===wDays.length;

                  return (
                    <div key={week.week} className="card" style={{ marginBottom:8 }}>
                      <div style={{ padding:"12px 16px 8px", display:"flex", alignItems:"center", gap:10, borderBottom:"1px solid var(--border)" }}>
                        <div style={{ width:26, height:26, borderRadius:7, background:allDoneW?colorHex+"22":"var(--card2)", border:`1px solid ${allDoneW?colorHex:"var(--border2)"}`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:"0.6875rem", fontWeight:800, color:allDoneW?color:"var(--sub)", flexShrink:0 }}>
                          {allDoneW?"✓":week.week}
                        </div>
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ fontSize:"0.6875rem", fontWeight:700, color, textTransform:"uppercase", letterSpacing:"0.06em" }}>{week.module}</div>
                          <div style={{ fontSize:"0.8125rem", fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{week.moduleTitle}</div>
                        </div>
                        <div style={{ textAlign:"right", flexShrink:0 }}>
                          <div style={{ fontSize:"0.8125rem", fontWeight:700, color }}>{wPct}%</div>
                          <div style={{ fontSize:"0.6875rem", color:"var(--sub)" }}>{wDone}/{wDays.length}</div>
                        </div>
                      </div>
                      <div style={{ padding:"10px 12px" }}>
                        <div className="grid-days" style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:7 }}>
                          {week.days.map((day) => {
                            const d    = wDays.find(x => x.day===day.day);
                            if (!d) return null;
                            const dk   = dayKey(d);
                            const isDn = completed[dk];
                            return (
                              <button key={dk} className="day-card"
                                onClick={() => goLearn(d)}
                                style={{ borderColor:isDn?colorHex+"55":undefined, background:isDn?colorHex+"12":undefined }}>
                                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
                                  <span style={{ fontSize:"0.5625rem", fontWeight:800, color:isDn?color:"var(--sub2)", textTransform:"uppercase", letterSpacing:"0.07em" }}>D{day.day}</span>
                                  {isDn && <span style={{ fontSize:"0.625rem", color }}>✓</span>}
                                </div>
                                <div style={{ fontSize:"0.625rem", color:isDn?"var(--text)":"var(--sub)", lineHeight:1.4, fontWeight:isDn?600:400, marginBottom:3 }}>{day.topic}</div>
                                <div style={{ fontSize:"0.5625rem", color:"var(--sub2)" }}>{fmtShort(d.date)}</div>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      </main>

      <MobNav activeView="home" />
    </div>
  );

  // ══════════════════════════════════════════════════════════════════
  // CALENDAR
  // ══════════════════════════════════════════════════════════════════
  if (view==="calendar") {
    const filtered = calFilter==="all" ? allDays : allDays.filter(d => d.courseShort===calFilter);
    return (
      <div className="shell">
        <style>{BASE_STYLES}</style>
        <style>{`#mob-menu { display:flex !important; } @media(min-width:901px){#mob-menu{display:none!important;}}`}</style>
        {sharedSidebar}

        <main className="main">
          <Topbar
            onMenuClick={() => setSidebar(s=>!s)}
            mid={<div style={{ fontSize:"0.8125rem", fontWeight:600, color:"var(--sub)", paddingLeft:4 }}>Calendar</div>}
            right={
              <>
                <div style={{ display:"flex", gap:5 }}>
                  {[["all","All"],["Python","🐍"],["ML","🤖"]].map(([val,lbl]) => (
                    <button key={val} onClick={() => setCalFilter(val)}
                      style={{ padding:"5px 11px", borderRadius:7, fontSize:"0.75rem", fontWeight:600,
                        border:`1px solid ${calFilter===val?(val==="ML"?"var(--ml)":"var(--py)"):"var(--border2)"}`,
                        background:calFilter===val?(val==="ML"?"var(--ml-dim)":"var(--py-dim)"):"transparent",
                        color:calFilter===val?"var(--text)":"var(--sub)" }}>
                      {lbl}
                    </button>
                  ))}
                </div>
                <FontCtrl size={fontSize} onInc={incFont} onDec={decFont} />
              </>
            }
          />

          <div className="content">
            <div className="fade-up" style={{ display:"flex", alignItems:"center", gap:12, flexWrap:"wrap", marginBottom:20 }}>
              <h1 style={{ fontSize:"clamp(1.1rem,3vw,1.5rem)", fontWeight:800 }}>Study Calendar</h1>
              {streak>0 && <span className="streak">🔥 {streak} days</span>}
              <span style={{ marginLeft:"auto", fontSize:"0.75rem", color:"var(--sub)" }}>{done}/{total} complete</span>
            </div>

            <div className="grid-cal" style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:7 }}>
              {filtered.map((d) => {
                const dk   = dayKey(d);
                const isDn = completed[dk];
                const col  = d.courseShort==="Python" ? "var(--py)" : "var(--ml)";
                const dim  = d.courseShort==="Python" ? "var(--py-dim)" : "var(--ml-dim)";
                const glow = d.courseShort==="Python" ? "var(--py-glow)" : "var(--ml-glow)";
                return (
                  <div key={dk} className="day-card"
                    onClick={() => goLearn(d)}
                    style={{ background:isDn?dim:"var(--card)", borderColor:isDn?col+"55":"var(--border2)", boxShadow:isDn?`0 2px 12px ${glow}`:"none", padding:"9px 10px" }}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:5 }}>
                      <div>
                        <div style={{ fontSize:"0.5625rem", fontWeight:800, color:col, textTransform:"uppercase", letterSpacing:"0.07em" }}>{d.courseShort} W{d.week}</div>
                        <div style={{ fontSize:"0.5625rem", color:"var(--sub2)", marginTop:1 }}>{fmtShort(d.date)}</div>
                      </div>
                      <button onClick={(e)=>{e.stopPropagation(); saveDone({...completed,[dk]:!isDn});}}
                        style={{ width:19,height:19,borderRadius:5,border:`1.5px solid ${isDn?col:"var(--muted)"}`,background:isDn?col:"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"0.625rem",color:"#fff",flexShrink:0 }}>
                        {isDn?"✓":""}
                      </button>
                    </div>
                    <div style={{ fontSize:"0.625rem", color:isDn?"var(--text)":"var(--sub)", lineHeight:1.35, fontWeight:isDn?600:400 }}>{d.topic}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </main>
        <MobNav activeView="calendar" />
      </div>
    );
  }

  // ══════════════════════════════════════════════════════════════════
  // LEARN
  // ══════════════════════════════════════════════════════════════════
  if (view==="learn" && selDay) {
    const d      = selDay;
    const dk     = dayKey(d);
    const isDone = completed[dk];
    const isPy   = d.courseShort==="Python";
    const color  = isPy ? "var(--py)" : "var(--ml)";
    const colorH = isPy ? "#ff7340" : "#6c63ff";
    const glow   = isPy ? "var(--py-glow)" : "var(--ml-glow)";

    const wDays = allDays.filter(x => x.courseShort===d.courseShort && x.week===d.week);
    const idx   = allDays.findIndex(x => dayKey(x)===dk);
    const prevD = idx>0 ? allDays[idx-1] : null;
    const nextD = idx<allDays.length-1 ? allDays[idx+1] : null;

    return (
      <div className="shell">
        <style>{BASE_STYLES}</style>
        <style>{`#mob-menu { display:flex !important; } @media(min-width:901px){#mob-menu{display:none!important;}}`}</style>
        {sharedSidebar}

        <main className="main">
          <Topbar
            onMenuClick={() => setSidebar(s=>!s)}
            left={
              <button className="btn-ghost" onClick={() => setView("home")}>
                ← <span className="hide-mob">Dashboard</span>
              </button>
            }
            mid={
              <div style={{ minWidth:0, paddingLeft:8 }}>
                <div style={{ fontSize:"0.625rem", fontWeight:700, color, textTransform:"uppercase", letterSpacing:"0.1em" }}>
                  {d.courseShort} · Wk {d.week} · {d.module}
                </div>
                <div style={{ fontSize:"0.8125rem", fontWeight:700, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                  Day {d.day}: {d.topic}
                </div>
              </div>
            }
            right={
              <>
                <FontCtrl size={fontSize} onInc={incFont} onDec={decFont} />
                <button className="btn-cta"
                  style={{ background:isDone?"linear-gradient(135deg,#16a34a,#15803d)":`linear-gradient(135deg,${colorH},${colorH}bb)`, boxShadow:isDone?"0 4px 12px rgba(34,197,94,0.3)":`0 4px 12px ${glow}` }}
                  onClick={() => saveDone({...completed,[dk]:!isDone})}>
                  {isDone?"✅ Done":"Mark Done"}
                </button>
              </>
            }
          />

          {/* Day tabs */}
          <div style={{ background:"var(--surface)", borderBottom:"1px solid var(--border)", padding:"8px 18px", display:"flex", gap:5, overflowX:"auto", flexShrink:0 }}>
            {wDays.map((wd) => {
              const wdk = dayKey(wd);
              const sel = wdk===dk;
              const don = completed[wdk];
              return (
                <button key={wdk} className={`day-tab ${sel?"active":""}`}
                  onClick={() => { setSelDay(wd); setOpenSec({lecture:true}); window.scrollTo(0,0); }}
                  style={{ borderColor:sel?colorH:undefined, background:sel?colorH+"1a":undefined, color:sel?"var(--text)":undefined }}>
                  {don&&!sel?"✓ ":""}Day {wd.day}
                </button>
              );
            })}
          </div>

          <div className="content" style={{ maxWidth:840 }}>
            {/* Hero */}
            <div className="card fade-up" style={{ marginBottom:14, borderColor:colorH+"44", position:"relative", overflow:"hidden" }}>
              <div style={{ position:"absolute", top:0, left:0, right:0, height:3, background:`linear-gradient(90deg,${colorH},transparent)` }} />
              <div style={{ position:"absolute", top:-40, right:-40, width:160, height:160, background:colorH+"07", borderRadius:"50%", pointerEvents:"none" }} />
              <div className="card-p" style={{ padding:"20px 22px" }}>
                <div style={{ fontSize:"0.625rem", fontWeight:700, color, textTransform:"uppercase", letterSpacing:"0.12em", marginBottom:8 }}>
                  {fmtDate(d.date)} · {d.moduleTitle}
                </div>
                <h1 style={{ fontSize:"clamp(1.1rem,3vw,1.5rem)", fontWeight:800, lineHeight:1.2, marginBottom:6 }}>{d.topic}</h1>
                <p style={{ fontSize:"0.875rem", color:"var(--sub)", lineHeight:1.5 }}>{d.subtopic}</p>
              </div>
            </div>

            {/* Lecture */}
            <AccSection id="lecture" icon="📖" title="Lecture Notes" open={!!openSec.lecture} onToggle={() => toggleSec("lecture")}>
              <pre style={{ fontSize:"0.8125rem", color:"#c8d3f5", lineHeight:1.85, whiteSpace:"pre-wrap", background:"var(--card2)", padding:"14px 16px", borderRadius:10, overflowX:"auto" }}>
                {d.lecture}
              </pre>
            </AccSection>

            {/* Exercises */}
            <AccSection id="exercises" icon="✍️" title="Practice Exercises" open={!!openSec.exercises} onToggle={() => toggleSec("exercises")}>
              <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                {d.exercises.map((ex,i) => (
                  <div key={i} style={{ display:"flex", gap:12, alignItems:"flex-start", padding:"10px 14px", background:"var(--card2)", borderRadius:9, border:"1px solid var(--border2)" }}>
                    <div style={{ width:24, height:24, borderRadius:7, background:colorH+"20", border:`1px solid ${colorH}44`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:"0.6875rem", fontWeight:800, color, flexShrink:0, marginTop:1 }}>{i+1}</div>
                    <div style={{ fontSize:"0.875rem", color:"#c8d3f5", lineHeight:1.65 }}>{ex}</div>
                  </div>
                ))}
              </div>
            </AccSection>

            {/* Quiz */}
            <AccSection id="quiz" icon="🎯" title="Knowledge Check" open={!!openSec.quiz} onToggle={() => toggleSec("quiz")}>
              <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
                {d.quiz.map((q,qi) => {
                  const qid    = `${dk}-q${qi}`;
                  const chosen = quizAns[qid];
                  const ans    = chosen!==undefined;
                  const ok     = ans && chosen===q.ans;
                  return (
                    <div key={qi}>
                      <div style={{ fontSize:"0.875rem", fontWeight:600, marginBottom:10, lineHeight:1.5 }}>
                        <span style={{ color, fontWeight:800, marginRight:6 }}>Q{qi+1}.</span>{q.q}
                      </div>
                      <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                        {q.opts.map((opt,oi) => {
                          let st = {};
                          if (ans) {
                            if (oi===q.ans)      st = { background:"#052e16", borderColor:"#16a34a", color:"#86efac" };
                            else if (oi===chosen) st = { background:"#2d0a0a", borderColor:"#dc2626", color:"#fca5a5" };
                          } else if (chosen===oi) st = { borderColor:colorH, color:"var(--text)", background:colorH+"18" };
                          return (
                            <button key={oi} className="quiz-opt" disabled={ans}
                              onClick={() => !ans && setQuizAns(p=>({...p,[qid]:oi}))}
                              style={st}>
                              <span style={{ opacity:0.45, marginRight:8, fontFamily:"var(--mono)", fontSize:"0.75rem" }}>{String.fromCharCode(65+oi)}.</span>
                              {oi===q.ans&&ans?"✓ ":oi===chosen&&ans?"✗ ":""}{opt}
                            </button>
                          );
                        })}
                      </div>
                      {ans && (
                        <div style={{ marginTop:7, fontSize:"0.8125rem", fontWeight:600, color:ok?"#86efac":"#fca5a5", paddingLeft:2 }}>
                          {ok?"✓ Correct!":"✗ Correct answer: "+q.opts[q.ans]}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </AccSection>

            {/* Cheatsheet */}
            <div className="card" style={{ marginBottom:28, borderColor:colorH+"44", background:"#07090f" }}>
              <div style={{ padding:"12px 18px", borderBottom:"1px solid var(--border)" }}>
                <div style={{ fontSize:"0.625rem", fontWeight:700, color, textTransform:"uppercase", letterSpacing:"0.12em" }}>📋 Quick Reference</div>
              </div>
              <div style={{ padding:"14px 18px", fontFamily:"var(--mono)", fontSize:"0.8125rem", color:"#7dd3fc", lineHeight:2.1 }}>{d.cheatsheet}</div>
            </div>

            {/* Prev / Next */}
            <div style={{ display:"flex", gap:10 }}>
              {prevD ? (
                <button className="btn-ghost" style={{ flex:1, padding:"12px 14px", textAlign:"left", borderRadius:11, display:"block" }}
                  onClick={() => { setSelDay(prevD); setOpenSec({lecture:true}); window.scrollTo(0,0); }}>
                  <div style={{ fontSize:"0.5625rem", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:4, color:"var(--sub2)" }}>← Previous</div>
                  <div style={{ fontSize:"0.8125rem" }}>Day {prevD.day}: {prevD.topic}</div>
                </button>
              ) : <div style={{ flex:1 }} />}
              {nextD && (
                <button style={{ flex:1, padding:"12px 14px", textAlign:"right", borderRadius:11, background:colorH+"14", border:`1px solid ${colorH}44`, cursor:"pointer", boxShadow:`0 4px 16px ${glow}` }}
                  onClick={() => { setSelDay(nextD); setOpenSec({lecture:true}); window.scrollTo(0,0); }}>
                  <div style={{ fontSize:"0.5625rem", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:4, color }}>
                    {nextD.courseShort!==d.courseShort?nextD.courseShort+" → ":""}Next →
                  </div>
                  <div style={{ fontSize:"0.8125rem", color:"var(--text)" }}>Day {nextD.day}: {nextD.topic}</div>
                </button>
              )}
            </div>
          </div>
        </main>

        {/* Mobile bottom nav for learn */}
        <nav className="mobile-nav">
          <button className="mob-btn" onClick={() => setView("home")}>
            <span className="mob-icon">⊞</span><span>Home</span>
          </button>
          <button className="mob-btn" onClick={() => setView("calendar")}>
            <span className="mob-icon">◫</span><span>Calendar</span>
          </button>
          <button className="mob-btn" style={{ color }} onClick={() => saveDone({...completed,[dk]:!isDone})}>
            <span className="mob-icon">{isDone?"✅":"○"}</span><span>{isDone?"Done":"Mark"}</span>
          </button>
          <button className="mob-btn" onClick={incFont} disabled={fontSize>=22} style={{ opacity:fontSize>=22?0.35:1 }}>
            <span className="mob-icon" style={{ fontSize:"0.9rem", fontWeight:800 }}>A+</span><span>Bigger</span>
          </button>
          <button className="mob-btn" onClick={decFont} disabled={fontSize<=11} style={{ opacity:fontSize<=11?0.35:1 }}>
            <span className="mob-icon" style={{ fontSize:"0.75rem", fontWeight:800 }}>A-</span><span>Smaller</span>
          </button>
        </nav>
      </div>
    );
  }

  return null;
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
  </script>
</body>
</html>
